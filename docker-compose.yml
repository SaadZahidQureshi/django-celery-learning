version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: django_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: django_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: django_celery_worker
    # Note: No '-P solo' is needed here because Docker runs on Linux!
    command: celery -A conf worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - web

  celery_beat:
    build: .
    container_name: django_celery_beat
    command: celery -A conf beat -l info 
    volumes:
      - .:/app
    depends_on:
      - redis
      - web
